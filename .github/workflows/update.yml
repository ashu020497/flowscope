name: Daily data refresh

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 07:00 IST, every day
  workflow_dispatch: {}      # lets you run it any time from the Actions tab
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch sources and compute metrics
        env:
          PYTHONUNBUFFERED: "1"
          FLOWSCOPE_DEADLINE_MIN: "40"
        run: python -m pipeline.run

      - name: Save data back to the repo (keeps history between runs)
        run: |
          git config user.name "flowscope-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
